<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../Asset/logos/logo.ico" type="image/x-icon">
    <title>Eventos - Sistema de Gestão Esportiva</title>
    <link rel="stylesheet" href="eventos.css">
    <link rel="stylesheet" href="../../theme.css">
    <script src="../../theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <button class="back-btn" onclick="voltarPagina()">← Voltar</button>
    
    <div class="container">
        <div class="header">
            <h1>EVENTOS ESPORTIVOS</h1>
            <p>Participe dos melhores eventos esportivos de Fortaleza</p>
        </div>
        
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="todos">Todos</button>
            <button class="filter-btn" data-filter="workshop">Workshops</button>
            <button class="filter-btn" data-filter="palestra">Palestras</button>
            <button class="filter-btn" data-filter="competição">Competições</button>
        </div>
        
        <div class="eventos-grid">
            <!-- Eventos serão carregados via JavaScript -->
        </div>
        <div class="card-grid">
        </div>
    </div>
    
    <script src="eventos.js"></script>
</body>
</html>
