<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../Asset/logos/logo.ico" type="image/x-icon">
    <title>Cadastro - Sistema Esportivo</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../theme.css">
    <script src="../../theme.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <img src="../../Asset/logos/nome-ludo-down-100.png" alt="Logo">
            <h2>Cadastro</h2>
            <form class="auth-form" onsubmit="handleRegister(event)">
                <input type="text" id="registerName" placeholder="Nome completo" required>
                <input type="email" id="registerEmail" placeholder="E-mail" required>
                <input type="text" id="registerCpf" placeholder="CPF" required>
                <button type="submit">Cadastrar</button>
                <p class="auth-help">Já tem conta? <a href="../login/login.html">Faça login</a></p>
                <p class="auth-help"><a href="../../index.html">← Voltar ao início</a></p>
            </form>
        </div>
    </div>
    <script src="registro.js"></script>
</body>
</html>
